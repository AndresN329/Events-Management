spring.application.name=events-management

# ==============================
# = DATA SOURCE (MySQL Aiven)
# ==============================
spring.datasource.url=${FLYWAY_URL}
spring.datasource.username=${FLYWAY_USER}
spring.datasource.password=${FLYWAY_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.data-source-properties.sslMode=REQUIRED

# ==============================
# = JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=validate
# Cuando usas Flyway, no conviene update, porque Flyway se encarga de crear/migrar las tablas.
# Para Flyway, siempre es mejor validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.type.descriptor.sql.BasicBinder.log=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.level=%5p [traceId=%X{traceId}]

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==============================
# = SERVER CONFIG
# ==============================
server.port=8080

# ==============================
# = OPENAPI (Swagger)
# ==============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================
# = FLYWAY
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Necesario porque la BD ya contiene tablas sin la tabla de historial de Flyway
spring.flyway.baseline-on-migrate=true
