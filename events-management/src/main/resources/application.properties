spring.application.name=events-management

# ==============================
# = DATA SOURCE (MySQL Aiven)
# ==============================
spring.datasource.url=jdbc:mysql://
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.data-source-properties.sslMode=REQUIRED

# ==============================
# = JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
# Nota: Cuando usas Flyway, normalmente no conviene update, porque Flyway se encarga de crear/migrar las tablas.
# Podrías ponerlo en validate para que Hibernate solo valide el esquema: (lo desactive flyway por incompativilidad y puse update)

# Mostrar SQL sin truncar
spring.jpa.show-sql=true

# Formato legible
spring.jpa.properties.hibernate.format_sql=true

# Mostrar parámetros de queries (MUY útil para debug)
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.type.descriptor.sql.BasicBinder.log=true

# Log level más detallado
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==============================
# = SERVER CONFIG
# ==============================
server.port=8080

# ==============================
# = OPENAPI (Swagger)
# ==============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================
# = FLYWAY
# ==============================
# Se desactiva Flyway (Opción A) para evitar el error de base de datos no soportada (Unsupported Database: MySQL 8.0)
# y permitir que Hibernate (ddl-auto=validate) o un control manual se encarguen del esquema.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration